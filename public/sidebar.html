<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      .dev-copilot-container {
        --dev-copilot-accent: var(--red-ui-workspace-button-background-primary, #ad1625);
        --dev-copilot-accent-hover: var(--red-ui-workspace-button-background-primary-hover, #6e0a1e);
        --dev-copilot-accent-text: var(--red-ui-workspace-button-color-primary, #eee);
        --dev-copilot-panel-background: var(--red-ui-primary-background, #f3f3f3);
        --dev-copilot-card-background: var(--red-ui-secondary-background, #fff);
        --dev-copilot-card-background-hover: var(--red-ui-secondary-background-hover, #e6e6e6);
        --dev-copilot-text: var(--red-ui-primary-text-color, #555);
        --dev-copilot-text-muted: var(--red-ui-secondary-text-color, #888);
        --dev-copilot-border: var(--red-ui-secondary-border-color, #ddd);
        --dev-copilot-strong-border: var(--red-ui-primary-border-color, #bbb);
        --dev-copilot-danger: var(--red-ui-border-color-error, #df2935);
        --dev-copilot-warning: var(--red-ui-border-color-warning, #ffcf70);
        --dev-copilot-info: var(--red-ui-text-color-link, #08c);
        --dev-copilot-success: var(--red-ui-text-color-success, #3a3);
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 6px;
        box-sizing: border-box;
        overflow: hidden;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--dev-copilot-card-background);
        color: var(--dev-copilot-text);
      }

      .dev-copilot-header {
        border-bottom: 1px solid var(--dev-copilot-border);
        padding-bottom: 6px;
        margin-bottom: 6px;
        flex-shrink: 0;
      }

      .dev-copilot-node-controls,
      .dev-copilot-stream-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .dev-copilot-node-controls {
        margin-bottom: 6px;
      }

      .dev-copilot-stream-row {
        margin-bottom: 4px;
        font-size: 12px;
      }

      .dev-copilot-stream-label {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        color: var(--dev-copilot-text-muted);
      }

      .dev-copilot-stream-status {
        color: var(--dev-copilot-text-muted);
        flex: 1;
        text-align: right;
      }

      .dev-copilot-stream-status.is-enabled {
        color: var(--dev-copilot-success);
      }

      .dev-copilot-stream-label input {
        margin: 0;
      }

      .dev-copilot-node-selector {
        flex: 1;
        padding: 3px;
        border: 1px solid var(--red-ui-form-input-border-color, var(--dev-copilot-border));
        border-radius: 3px;
        margin-bottom: 0;
        font-size: 12px;
        background: var(--red-ui-form-input-background, var(--dev-copilot-card-background));
        color: var(--red-ui-form-text-color, var(--dev-copilot-text));
      }

      .dev-copilot-node-selector:focus,
      .dev-copilot-input:focus {
        border-color: var(--red-ui-form-input-border-selected-color, var(--dev-copilot-strong-border));
        outline: 1px solid var(--red-ui-form-input-focus-color, rgba(85, 150, 230, 0.8));
      }

      /* Clear button styles */
      .dev-copilot-clear-btn {
        background: var(--dev-copilot-danger);
        color: var(--dev-copilot-accent-text);
        border: none;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
      }

      .dev-copilot-clear-btn:hover {
        background: var(--dev-copilot-accent-hover);
      }

      .dev-copilot-messages {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        border: 1px solid var(--dev-copilot-border);
        border-radius: 3px;
        padding: 8px;
        margin-bottom: 6px;
        background: var(--dev-copilot-panel-background);
        color: var(--dev-copilot-text);
        scroll-behavior: smooth;
        min-height: 0;
        scrollbar-color: var(--dev-copilot-strong-border) var(--dev-copilot-panel-background);
      }

      .dev-copilot-messages::after {
        content: "";
        display: table;
        clear: both;
      }

      /* Scrollbar styles */
      .dev-copilot-messages::-webkit-scrollbar {
        width: 8px;
      }

      .dev-copilot-messages::-webkit-scrollbar-track {
        background: var(--dev-copilot-panel-background);
        border-radius: 4px;
      }

      .dev-copilot-messages::-webkit-scrollbar-thumb {
        background: var(--dev-copilot-strong-border);
        border-radius: 4px;
      }

      .dev-copilot-messages::-webkit-scrollbar-thumb:hover {
        background: var(--dev-copilot-text-muted);
      }



      .dev-copilot-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .dev-copilot-input-area {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
        margin-bottom: 2px;
      }

      .dev-copilot-input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid var(--red-ui-form-input-border-color, var(--dev-copilot-border));
        border-radius: 3px;
        resize: none;
        min-height: 32px;
        max-height: 60px;
        font-family: inherit;
        font-size: 13px;
        overflow-y: auto;
        background: var(--red-ui-form-input-background, var(--dev-copilot-card-background));
        color: var(--red-ui-form-text-color, var(--dev-copilot-text));
      }

      .dev-copilot-input::placeholder {
        color: var(--red-ui-form-placeholder-color, var(--dev-copilot-text-muted));
      }

      .dev-copilot-send {
        background: var(--dev-copilot-accent);
        color: var(--dev-copilot-accent-text);
        border: none;
        padding: 6px 12px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        white-space: nowrap;
        position: relative;
        transition: all 0.2s ease;
        min-width: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .dev-copilot-send:hover {
        background: var(--dev-copilot-accent-hover);
        transform: translateY(-1px);
      }

      .dev-copilot-send:disabled {
        background: var(--red-ui-form-button-background, var(--dev-copilot-card-background-hover));
        color: var(--red-ui-secondary-text-color-disabled, var(--dev-copilot-text-muted));
        cursor: not-allowed;
        transform: none;
      }

      /* Status-aware send button states */
      .dev-copilot-send.generating {
        background: var(--dev-copilot-danger);
        cursor: pointer;
      }

      .dev-copilot-send.generating:hover {
        background: var(--dev-copilot-accent-hover);
        transform: translateY(-1px);
      }

      /* Icon animations */
      .dev-copilot-send .icon-sending {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Improved message styles with consistent UI */
      .dev-copilot-message {
        margin-bottom: 15px;
        padding: 10px 14px;
        border-radius: 12px;
        width: fit-content;
        max-width: 85%;
        word-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.5;
        display: block;
        position: relative;
        clear: both;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* User message styles */
      .dev-copilot-message.user {
        background: var(--dev-copilot-accent);
        color: var(--dev-copilot-accent-text);
        margin-left: auto;
        margin-right: 0;
        text-align: left;
        float: right;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
        border-bottom-right-radius: 4px;
      }

      /* Assistant message styles */
      .dev-copilot-message.assistant {
        background: var(--dev-copilot-card-background);
        color: var(--dev-copilot-text);
        margin-right: auto;
        margin-left: 0;
        float: left;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
        border: 1px solid var(--dev-copilot-border);
        border-bottom-left-radius: 4px;
      }

      /* Streaming message styles (same as assistant) */
      .dev-copilot-message.streaming {
        background: var(--dev-copilot-card-background);
        color: var(--dev-copilot-text);
        margin-right: auto;
        margin-left: 0;
        float: left;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
        border: 1px solid var(--dev-copilot-border);
        border-bottom-left-radius: 4px;
        position: relative;
      }

      /* Streaming indicator */
      .dev-copilot-message.streaming::after {
        content: "●";
        position: absolute;
        bottom: 8px;
        right: 10px;
        color: var(--dev-copilot-success);
        animation: pulse 1.5s ease-in-out infinite;
        font-size: 8px;
      }

      /* Error message styles */
      .dev-copilot-message.error {
        background: var(--dev-copilot-card-background);
        color: var(--red-ui-text-color-error, #ad1625);
        border: 1px solid var(--dev-copilot-danger);
        margin-right: auto;
        margin-left: 0;
        float: left;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
      }

      /* Info message styles */
      .dev-copilot-message.info {
        background: var(--dev-copilot-card-background);
        border-left: 4px solid var(--dev-copilot-info);
        color: var(--dev-copilot-text);
        margin: 12px 0;
        float: none;
        clear: both;
        max-width: 100%;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
      }

      /* Warning message styles */
      .dev-copilot-message.warning {
        background: var(--dev-copilot-card-background);
        border-left: 4px solid var(--dev-copilot-warning);
        color: var(--dev-copilot-text);
        margin: 12px 0;
        float: none;
        clear: both;
        max-width: 100%;
        box-shadow: 0 2px 8px var(--red-ui-shadow, rgba(0, 0, 0, 0.2));
      }

      .dev-copilot-message.tool-call {
        border-left: 3px solid var(--dev-copilot-info);
      }

      .dev-copilot-message.markdown-rendered {
        white-space: normal;
      }

      .dev-copilot-message p,
      .dev-copilot-message ul,
      .dev-copilot-message ol,
      .dev-copilot-message blockquote,
      .dev-copilot-message pre,
      .dev-copilot-message table {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .dev-copilot-message p:last-child,
      .dev-copilot-message ul:last-child,
      .dev-copilot-message ol:last-child,
      .dev-copilot-message blockquote:last-child,
      .dev-copilot-message pre:last-child,
      .dev-copilot-message table:last-child {
        margin-bottom: 0;
      }

      .dev-copilot-message ul,
      .dev-copilot-message ol {
        padding-left: 20px;
      }

      .dev-copilot-message blockquote {
        border-left: 3px solid var(--dev-copilot-border);
        color: var(--dev-copilot-text-muted);
        padding-left: 10px;
      }

      .dev-copilot-message pre {
        background: var(--red-ui-tertiary-background, #f7f7f7);
        border: 1px solid var(--dev-copilot-border);
        border-radius: 4px;
        overflow-x: auto;
        padding: 8px;
        white-space: pre;
      }

      .dev-copilot-message code {
        background: var(--red-ui-tertiary-background, #f7f7f7);
        border: 1px solid var(--dev-copilot-border);
        border-radius: 3px;
        font-family: Menlo, Consolas, Monaco, monospace;
        font-size: 12px;
        padding: 1px 3px;
      }

      .dev-copilot-message pre code {
        background: transparent;
        border: 0;
        padding: 0;
        white-space: inherit;
      }

      .dev-copilot-message table {
        border-collapse: collapse;
        display: block;
        max-width: 100%;
        overflow-x: auto;
      }

      .dev-copilot-message th,
      .dev-copilot-message td {
        border: 1px solid var(--dev-copilot-border);
        padding: 4px 6px;
        text-align: left;
      }

      .dev-copilot-message a {
        color: var(--dev-copilot-info);
      }

      /* Loading animation improvement */
      .dev-copilot-message.loading {
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      .dev-copilot-empty-state {
        text-align: center;
        color: var(--dev-copilot-text-muted);
        font-style: italic;
        padding: 20px 10px;
        margin-top: 20px;
      }

      .dev-copilot-title {
        font-weight: bold;
        margin-bottom: 6px;
        color: var(--dev-copilot-text);
        font-size: 14px;
      }

      .dev-copilot-shortcuts {
        font-size: 11px;
        color: var(--dev-copilot-text-muted);
        margin-top: 4px;
        margin-bottom: 0;
        padding-bottom: 4px;
        flex-shrink: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="dev-copilot-container">
      <!-- Header -->
      <div class="dev-copilot-header">
        <div class="dev-copilot-title">AI Development Copilot</div>

        <!-- Node selector and controls -->
        <div class="dev-copilot-node-controls">
          <select id="dev-copilot-node-select" class="dev-copilot-node-selector">
            <option value=""> nodes...</option>
          </select>
          <button id="dev-copilot-clear" class="dev-copilot-clear-btn" title="Clear all global chat history (shared across all nodes)">
            🗑️ Clear
          </button>
        </div>
        
        <!-- Stream mode toggle -->
        <div class="dev-copilot-stream-row">
          <label class="dev-copilot-stream-label">
            <input type="checkbox" id="dev-copilot-stream-toggle" checked>
            <span>Stream mode</span>
          </label>
          <small class="dev-copilot-stream-status is-enabled" id="stream-status">Real-time streaming enabled</small>
        </div>

      </div>

      <!-- Main content area -->
      <div class="dev-copilot-content">
        <!-- Message area -->
        <div id="dev-copilot-messages" class="dev-copilot-messages">
          <div class="dev-copilot-empty-state">
            Select a Dev Copilot node and start chatting!<br />
            <small
              >Ask about Node-RED development questions.</small
            >
          </div>
        </div>

        <!-- Input area -->
        <div class="dev-copilot-input-area">
          <textarea
            id="dev-copilot-input"
            class="dev-copilot-input"
            placeholder="Ask me anything about development..."
            rows="1"
          ></textarea>
          <button id="dev-copilot-send" class="dev-copilot-send" data-state="ready">
            <span class="send-icon">▶</span>
            <span class="send-text">Send</span>
          </button>
        </div>

        <!-- Shortcut tips -->
        <div class="dev-copilot-shortcuts">
          <strong>Tips:</strong> Enter to send • Shift+Enter for new line
        </div>
      </div>


    <script src="{{API_PREFIX}}/vendor/marked.umd.js"></script>
    <script src="{{API_PREFIX}}/vendor/purify.min.js"></script>
    <script>
      // Inject API prefix configuration
      window.NODE_HTTP_API_PREFIX = '{{API_PREFIX}}';
      
      // Auto-adjust input box height
      document.addEventListener("DOMContentLoaded", function () {
        const textarea = document.getElementById("dev-copilot-input");
        if (textarea) {
          textarea.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 100) + "px";
          });
        }
      });
    </script>
  </body>
</html>
